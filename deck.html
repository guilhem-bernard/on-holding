<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Financial Analysis: On Holding AG · Deck</title>
<meta name="author" content="Guilhem Bernard">
<style>
@font-face{font-family:'Inter Tight';font-weight:500;src:url(fonts/inter-tight-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter Tight';font-weight:600;src:url(fonts/inter-tight-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
:root{--ink:#111111;--ink-2:#3A3A3C;--line:#E5E5EA;--bg:#F2F2F4;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter Tight',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 20px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:rgba(242,242,244,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top a.back{color:var(--ink);text-decoration:none;font-weight:600;font-size:16px;min-height:40px;display:inline-flex;align-items:center}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;min-height:40px;padding:0 18px;border-radius:999px;font:600 15px/1 'Inter Tight',system-ui,sans-serif;text-decoration:none;color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px #D1D1D6;border:0;cursor:pointer}
.btn:hover{opacity:.86}
.btn.dark{background:var(--ink);color:#fff;box-shadow:none}
main{max-width:1680px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.stage{position:relative;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(17,17,17,.06),0 16px 44px rgba(17,17,17,.12);aspect-ratio:16/9;max-height:calc(100vh - 170px);margin:0 auto;width:100%}
.stage img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
.nav{position:absolute;top:0;bottom:0;width:22%;border:0;background:transparent;cursor:pointer}
.nav.prev{left:0}.nav.next{right:0}
.nav:focus-visible{outline:2px solid var(--ink);outline-offset:-4px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.count{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-size:14px;letter-spacing:.1em;color:var(--ink-2)}
.arrows{display:flex;gap:8px}
.arrows .btn{min-width:52px;justify-content:center;font-size:18px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.thumbs button{padding:0;border:0;border-radius:8px;overflow:hidden;cursor:pointer;background:#fff;box-shadow:inset 0 0 0 1px var(--line);opacity:.7}
.thumbs button[aria-current="true"]{opacity:1;box-shadow:0 0 0 2px var(--ink)}
.thumbs img{display:block;width:100%;aspect-ratio:16/9}
.fine{font-size:13px;color:var(--ink-2)}
</style>
</head>
<body>
<div class="top">
  <a class="back" href="index.html">&larr; Financial Analysis: On Holding AG</a>
  <div class="acts">
    <a class="btn" href="note.html">Read the note</a>
    <a class="btn" href="files/On_Holding_Financial_Analysis_deck_Guilhem_Bernard.pdf" download data-dl="deckpdf">Download PDF</a>
    <a class="btn dark" href="files/On_Holding_Financial_Analysis_deck_Guilhem_Bernard.pptx" download data-dl="deckpptx">Download PowerPoint</a>
  </div>
</div>
<main>
  <div class="stage">
    <img id="slide" src="deck/slide-01.png" alt="Slide 1 of 12">
    <button class="nav prev" type="button" aria-label="Previous slide" id="hit-prev"></button>
    <button class="nav next" type="button" aria-label="Next slide" id="hit-next"></button>
  </div>
  <div class="bar">
    <span class="count" id="count">01 / 12</span>
    <span class="fine">Use the arrow keys or click the sides of the slide. © 2026 Guilhem Bernard · Not investment advice</span>
    <div class="arrows"><button class="btn" type="button" id="prev" aria-label="Previous slide">&larr;</button><button class="btn dark" type="button" id="next" aria-label="Next slide">&rarr;</button></div>
  </div>
  <div class="thumbs" id="thumbs"></div>
</main>
<script>
(function(){
  var N = 12, i = 0, img = document.getElementById('slide'), thumbs = document.getElementById('thumbs');
  var src = function(k){ return 'deck/slide-' + String(k + 1).padStart(2, '0') + '.png'; };
  for (var k = 0; k < N; k++) {
    var b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', 'Slide ' + (k + 1));
    var t = document.createElement('img'); t.src = src(k); t.alt = ''; t.loading = 'lazy';
    b.appendChild(t); (function(k){ b.addEventListener('click', function(){ go(k); }); })(k); thumbs.appendChild(b);
  }
  function go(k){
    i = Math.max(0, Math.min(N - 1, k));
    img.src = src(i); img.alt = 'Slide ' + (i + 1) + ' of ' + N;
    document.getElementById('count').textContent = String(i + 1).padStart(2, '0') + ' / ' + N;
    thumbs.querySelectorAll('button').forEach(function(b, j){ b.setAttribute('aria-current', j === i ? 'true' : 'false'); });
    if (i + 1 < N) { var p = new Image(); p.src = src(i + 1); }
  }
  ['prev','hit-prev'].forEach(function(id){ document.getElementById(id).addEventListener('click', function(){ go(i - 1); }); });
  ['next','hit-next'].forEach(function(id){ document.getElementById(id).addEventListener('click', function(){ go(i + 1); }); });
  document.addEventListener('keydown', function(e){ if (e.key === 'ArrowRight' || e.key === 'PageDown') go(i + 1); if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(i - 1); });
  go(0);
  /* Inside the Claude viewer, files go through its download prompt; on a normal web host the links work as they are. */
  if (!(window.claude && window.claude.use)) return;
  var b64 = {deckpptx:'files/deck.pptx.b64.txt'};
  window.claude.use('downloads').then(function(dl){
    document.querySelectorAll('[data-dl]').forEach(function(a){
      a.addEventListener('click', function(e){
        e.preventDefault(); if (!dl) return;
        var key = a.getAttribute('data-dl'), href = a.getAttribute('href');
        fetch(b64[key] || href).then(function(r){ return b64[key] ? r.text().then(function(t){ var s = atob(t.trim()), u = new Uint8Array(s.length); for (var j = 0; j < s.length; j++) u[j] = s.charCodeAt(j); return new Blob([u]); }) : r.blob(); })
          .then(function(blob){ return dl.save({filename: href.split('/').pop(), data: blob}); }).catch(function(){});
      });
    });
  });
})();
</script>
</body>
</html>
